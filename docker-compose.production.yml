services:
  app:
    # Use your custom image or build from local Dockerfile
    # Option 1: Use pre-built image (if you've pushed it)
    # image: code-review-training:latest
    # Option 2: Build from local Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_review_training
    networks:
      - code-review-net
    volumes:
      # Persist database
      - ./prisma:/app/prisma
      # Persist challenge data
      - ./data:/app/data
      # Backward compatibility
      - ./src/data:/app/src/data
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - DATABASE_URL=file:./prisma/dev.db
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-your-super-secret-admin-session-key-at-least-32-chars}
    env_file:
      - .env.local
    # Don't expose ports directly - nginx will handle all traffic
    expose:
      - "3000"
      - "4001"
    # Always push the schema (idempotent for additive changes, e.g. new tables)
    # instead of only on first boot - otherwise a schema change like adding
    # SessionArchive never reaches a host that already has a dev.db.
    command: sh -c "npx prisma db push && npm run start:prod"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      # Expose HTTPS on port 3000
      - "0.0.0.0:3000:3000"

    networks:
      - code-review-net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS cert reused from the DefectDojo stack on the same VM - host-specific
      # path. nginx.conf expects listen 3000 ssl, so this is NOT optional:
      # without it, `docker compose up` fails validation (or, on older Compose
      # versions that tolerate the missing volume line, nginx starts but can't
      # find the cert and fails). Point this at wherever your TLS cert/key
      # actually live if deploying to a different host.
      - /home/jamesbond/defectdojo/django-DefectDojo/ssl/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - /home/jamesbond/defectdojo/django-DefectDojo/ssl/nginx.key:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      - app
    restart: unless-stopped

networks:
  code-review-net:
    driver: bridge

# Note: Using bind mounts instead of named volumes for easier access
# If you prefer named volumes, uncomment below:
# volumes:
#   code_review_data:
#     external: true
